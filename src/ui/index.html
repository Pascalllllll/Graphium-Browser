<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src http: https: data:">
<title>Graphium</title>
<link rel="stylesheet" href="ui.css">
<style id="user-css"></style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 16 16"><path d="M13 8H3.5M7.5 3.5 3 8l4.5 4.5"/></symbol>
    <symbol id="i-forward" viewBox="0 0 16 16"><path d="M3 8h9.5M8.5 3.5 13 8l-4.5 4.5"/></symbol>
    <symbol id="i-reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.47-3.54"/><path d="M13 2.5V5h-2.5"/></symbol>
    <symbol id="i-stop" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
    <symbol id="i-home" viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></symbol>
    <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 1.75 13 3.6v3.9c0 3.05-2.05 5.55-5 6.75-2.95-1.2-5-3.7-5-6.75V3.6Z"/></symbol>
    <symbol id="i-shield-off" viewBox="0 0 16 16"><path d="M8 1.75 13 3.6v3.9c0 3.05-2.05 5.55-5 6.75-2.95-1.2-5-3.7-5-6.75V3.6Z"/><path d="m2 2 12 12"/></symbol>
    <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></symbol>
    <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.25"/><path d="M5.5 7V5.25a2.5 2.5 0 0 1 5 0V7"/></symbol>
    <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.75"/><path d="M2.25 8h11.5M8 2.25c1.6 1.6 2.4 3.5 2.4 5.75S9.6 12.15 8 13.75C6.4 12.15 5.6 10.25 5.6 8S6.4 3.85 8 2.25Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 16 16"><path d="m8 2 1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5Z"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="m4 10 4-4 4 4"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 16 16"><path d="M9 1.75 3.5 9H8l-1 5.25L12.5 7H8Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.75"/><path d="M8 4.75V8l2.25 1.5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 16 16"><path d="M5 6.5H10a3 3 0 0 1 0 6H6.5"/><path d="M7 4 4.5 6.5 7 9"/></symbol>
    <symbol id="i-split" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M8 3v10"/></symbol>
    <symbol id="i-chip" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/><path d="M6 2v2M10 2v2M6 12v2M10 12v2M2 6h2M2 10h2M12 6h2M12 10h2"/></symbol>
    <symbol id="i-calc" viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 5h5M5.5 8.5h1M9.5 8.5h1M5.5 11h1M9.5 11h1"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.25 3.25"/></symbol>
  </defs>
</svg>

<header id="strip">
  <div id="tabs" role="tablist" aria-label="Tabs"></div>
  <button id="new-tab" class="icon" title="New tab" aria-label="New tab"><svg><use href="#i-plus"/></svg></button>
  <span id="private-label" hidden>Private</span>
</header>

<nav id="bar">
  <button id="back" class="icon" title="Back" aria-label="Back" disabled><svg><use href="#i-back"/></svg></button>
  <button id="forward" class="icon" title="Forward" aria-label="Forward" disabled><svg><use href="#i-forward"/></svg></button>
  <button id="reload" class="icon" title="Reload" aria-label="Reload"><svg><use href="#i-reload"/></svg></button>
  <button id="home" class="icon" title="Home" aria-label="Home" hidden><svg><use href="#i-home"/></svg></button>

  <form id="address" autocomplete="off">
    <span id="site" aria-hidden="true"></span>
    <input id="url" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Address and search bar">
    <button id="popup" type="button" class="chip" title="This site tried to open a pop-up. Click to open it." hidden>Pop-up blocked</button>
    <button id="zoom" type="button" class="chip" title="Reset zoom" hidden></button>
    <button id="star" type="button" class="chip" aria-label="Add to new tab page" hidden><svg><use href="#i-star"/></svg></button>
    <button id="shields" type="button" class="chip" aria-label="Shields" hidden><svg><use href="#i-shield"/></svg><span id="blocked"></span></button>
  </form>

  <button id="downloads" class="icon" title="Downloads" aria-label="Downloads" hidden><svg><use href="#i-download"/></svg><span id="dl-progress"></span></button>
  <button id="menu" class="icon" title="Menu" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
</nav>

<div id="find" hidden>
  <input id="find-input" type="text" spellcheck="false" placeholder="Find in page" aria-label="Find in page">
  <span id="find-count"></span>
  <button id="find-prev" class="icon" title="Previous (Shift+Enter)" aria-label="Previous match"><svg><use href="#i-up"/></svg></button>
  <button id="find-next" class="icon" title="Next (Enter)" aria-label="Next match"><svg><use href="#i-down"/></svg></button>
  <button id="find-close" class="icon" title="Close (Esc)" aria-label="Close find"><svg><use href="#i-close"/></svg></button>
</div>

<div id="palette" hidden>
  <div id="palette-backdrop"></div>
  <div id="palette-box" role="dialog" aria-label="Command palette">
    <div id="palette-head">
      <span id="palette-mode"></span>
      <input id="palette-input" type="text" spellcheck="false" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
    </div>
    <div id="palette-list" role="listbox" aria-label="Results"></div>
    <div id="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>&gt;</kbd> commands only</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>

<script src="palette.js"></script>
<script src="ui.js"></script>
</body>
</html>
