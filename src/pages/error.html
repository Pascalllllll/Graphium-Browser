<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page did not load</title>
<link rel="stylesheet" href="pages.css">
<style>
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 20vh 24px 48px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 8px; }
  #url { color: var(--text); word-break: break-all; }
  #code { font-size: 12.5px; margin-top: 16px; }
  #retry, #proceed { margin-top: 24px; margin-right: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="title">This page did not load</h1>
  <p id="detail"></p>
  <p id="url"></p>
  <button id="retry" class="primary" type="button">Try again</button>
  <button id="proceed" type="button" hidden>Continue to the site anyway</button>
  <p id="code"></p>
</main>
<script src="error.js"></script>
</body>
</html>
