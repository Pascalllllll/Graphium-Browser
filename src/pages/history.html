<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>
<link rel="stylesheet" href="pages.css">
<style>
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 auto 0 0; }
  #q { width: min(320px, 50vw); border-radius: 999px; padding: 0 16px; }
  h2 {
    margin: 28px 0 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 8px;
    border-radius: 6px;
  }
  .item:hover { background: var(--surface); }
  .time {
    width: 64px;
    flex: none;
    color: var(--muted);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .item a {
    flex: 1;
    min-width: 0;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item a:hover { text-decoration: underline; }
  .host { color: var(--muted); font-size: 12.5px; margin-left: 8px; }
  .item button {
    height: 26px;
    padding: 0 8px;
    border: 0;
    background: none;
    color: var(--muted);
    opacity: 0;
  }
  .item:hover button,
  .item button:focus-visible { opacity: 1; }
  .item button:hover { background: var(--surface-hover); color: var(--text); }
  .empty { color: var(--muted); margin-top: 40px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>History</h1>
    <input id="q" type="text" placeholder="Search history" aria-label="Search history">
    <button id="clear" class="danger">Clear all</button>
  </header>
  <div id="list"></div>
</main>
<script src="history.js"></script>
</body>
</html>
