name: Feature idea
description: Suggest something that would make Graphium better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, then the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
