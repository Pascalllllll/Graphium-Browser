name: Release

# Push a tag like v1.0.1 and this builds installers for Windows, macOS and
# Linux, then publishes a GitHub Release with them attached and that version's
# CHANGELOG.md section as the release text. Free on public repos.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Fails fast if the tag, package.json and CHANGELOG.md disagree, before
  # spending ten minutes on builds.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "Tag is $GITHUB_REF_NAME but package.json says $pkg"; exit 1
          fi
      - name: Extract this version from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  # Each OS builds its own installers. Uploading is left to the release job so
  # the three builds can't race each other creating the release.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          # No paid signing certificate; build unsigned instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Checksums
        run: |
          mkdir files
          find out/dist-* -type f -exec mv {} files/ \;
          cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A re-pushed tag replaces the files and text of its existing release.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Graphium ${GITHUB_REF_NAME#v}" --notes-file out/notes/notes.md
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Graphium ${GITHUB_REF_NAME#v}" \
            --notes-file out/notes/notes.md \
            --verify-tag
