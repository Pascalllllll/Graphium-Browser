name: CI

# Runs the end-to-end checks on every push and pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Plain Xvfb rather than xvfb-run, whose temp-dir cleanup can fail and
      # turn a passing run into exit code 5.
      - run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 2
          DISPLAY=:99 npm test
